name: Check if code is formatted

on:
  pull_request:
    branches:
      - main

jobs:
  run-npm-command:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup asdf
        uses: ynab/asdf-action@v1.2
        with:
          version: 0.16.7

      - name: Setup Node version
        working-directory: mobile
        run: |
          asdf plugin add nodejs
          asdf install nodejs
          echo "node_version=$(asdf current nodejs | xargs | cut -d ' ' -f 6)" >> $GITHUB_ENV

      - name: Set nodejs as global exec
        run: |
          asdf set -u nodejs ${{ env.node_version }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      # .expo/types/router.d.ts and expo-env.d.ts are generated by the dev server and
      # are not committed, so on a fresh checkout the tsconfig "include" entries for
      # them match nothing and tsc silently skips typed-route validation. This
      # generates them without starting Metro. See "Typed routes > Type generation":
      # https://docs.expo.dev/router/reference/typed-routes/#type-generation
      - name: Generate expo-router types
        working-directory: mobile
        run: npx expo customize tsconfig.json

      - name: Run ts:check
        working-directory: mobile
        run: npm run ts:check

      - name: Run lint
        working-directory: mobile
        run: npm run lint

      - name: Run prettier:fix
        working-directory: mobile
        run: npx prettier .
